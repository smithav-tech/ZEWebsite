<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZeroEarth — decarbonising dairy. milk, made better for the planet.</title>
    <meta
      name="description"
      content="ZeroEarth is decarbonising dairy: CH₄OW cuts cattle methane by 23%, TMR improves feed, CBG turns manure into energy, and gramCarbon traces it all along a clean low-carbon milk corridor."
    />
    <meta property="og:title" content="ZeroEarth — decarbonising dairy. milk, made better for the planet." />
    <meta
      property="og:description"
      content="ZeroEarth is decarbonising dairy: CH₄OW cuts cattle methane by 23%, TMR improves feed, CBG turns manure into energy, and gramCarbon traces it all along a clean low-carbon milk corridor."
    />
    <link rel="icon" type="image/png" href="/media/client/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the site's type -->
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- the loader's type -->
    <!-- the loader's paper from the very first frame, before any script runs:
         the same milk and glows as .loader (loader.css; keep the two in step),
         so the loader takes over from it without a flash. Pages with no loader
         get the plain milk. App removes it once the page is on screen. -->
    <style>
      body { margin: 0; background: #fffaf6; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 101;
        pointer-events: none;
        background:
          radial-gradient(42vmax 34vmax at 12% 8%, rgba(166, 207, 114, 0.2), transparent 70%),
          radial-gradient(46vmax 38vmax at 92% 96%, rgba(76, 191, 190, 0.18), transparent 70%),
          radial-gradient(30vmax 26vmax at 50% 46%, #ffffff, transparent 75%),
          #fffaf6;
      }
      #boot.boot--plain { background: #fffaf6; }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <script>
      if (location.pathname.replace(/\/+$/, "") !== "") document.getElementById("boot").className = "boot--plain";
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
